[test]
# Preload runs once before any test file. Snapshots real `pg` / `web-push`
# exports onto `globalThis.__REAL_*` so `scripts/test-helpers.ts#restoreLeaves`
# can re-mock leaf deps back to their real exports in test files'
# `afterAll`. Mirrors budget's pattern.
preload = ["./scripts/test-preload.ts"]

# Exclude test files themselves from the coverage report
coverageSkipTestFiles = true

# Exclude bundles that tests write to a scratch dir and dynamically import
# (e.g. app.test.ts writes /tmp/inbox-http-app-<pid>/app.js and imports it).
# Bun 1.4.1+ traces coverage on dynamically-imported files and would count
# the multi-thousand-line bundle against the src/ threshold.
coveragePathIgnorePatterns = ["**/tmp/**", "**/inbox-http-app-*/**", "**/build/**"]

# Conservative aggregate thresholds — enforce CI fails on coverage regression.
# Bun 1.4.0 checks these against the overall (weighted) coverage.
# Ratchet up as coverage improves.
coverageThreshold = { lines = 0.50, functions = 0.28 }
